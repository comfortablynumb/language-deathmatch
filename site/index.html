<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Language Deathmatch</title>
  <meta name="description" content="Choose a language, choose an arena and fight every other language on real benchmarks: the same programs in Go, Rust, C++, C, Assembly, Zig, V, Java, Haskell, Python and JavaScript, verified and measured in Docker.">
  <meta name="theme-color" content="#0b0d12">
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Teko:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css"
        integrity="sha384-wH75j6z1lH97ZOpMOInqhgKzFkAInZPPSPlZpYKYTOqsaizPvhQZmAtLcPKXpLyH" crossorigin="anonymous">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="flex min-h-screen flex-col">
  <a href="#app" class="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-50 focus:rounded-lg focus:bg-raised focus:px-3 focus:py-2">Skip to content</a>

  <header class="sticky top-0 z-30 border-b border-line/80 bg-page/80 backdrop-blur">
    <div class="mx-auto flex max-w-7xl items-center gap-4 px-4 py-3 sm:px-6">
      <a href="#/" class="flex shrink-0 items-center gap-2.5 font-bold tracking-tight" aria-label="Language Deathmatch home">
        <img src="assets/img/logo.svg" alt="" class="size-8">
        <span class="hidden font-display text-2xl leading-none tracking-wide uppercase sm:inline">Language <span class="gradient-text">Deathmatch</span></span>
      </a>
      <nav class="ml-auto flex items-center gap-1 overflow-x-auto text-sm" aria-label="Main">
        <a data-nav="deathmatch" href="#/deathmatch" class="rounded-lg px-3 py-1.5 font-semibold whitespace-nowrap text-gold hover:brightness-125 aria-[current=page]:bg-raised">Deathmatch</a>
        <a data-nav="home" href="#/" class="rounded-lg px-3 py-1.5 whitespace-nowrap text-ink-2 hover:text-ink aria-[current=page]:bg-raised aria-[current=page]:text-ink">Projects</a>
        <a data-nav="leaderboard" href="#/leaderboard" class="rounded-lg px-3 py-1.5 whitespace-nowrap text-ink-2 hover:text-ink aria-[current=page]:bg-raised aria-[current=page]:text-ink">Leaderboard</a>
        <a data-nav="fighters" href="#/fighters" class="rounded-lg px-3 py-1.5 whitespace-nowrap text-ink-2 hover:text-ink aria-[current=page]:bg-raised aria-[current=page]:text-ink">Fighters</a>
        <a data-nav="methodology" href="#/methodology" class="rounded-lg px-3 py-1.5 whitespace-nowrap text-ink-2 hover:text-ink aria-[current=page]:bg-raised aria-[current=page]:text-ink">Methodology</a>
      </nav>
    </div>
  </header>

  <main id="app" class="mx-auto w-full max-w-7xl flex-1 px-4 py-8 sm:px-6 sm:py-10" tabindex="-1">
    <div class="space-y-4" aria-busy="true" aria-label="Loading">
      <div class="skeleton h-72"></div>
      <div class="skeleton h-10 w-1/3"></div>
    </div>
  </main>

  <footer class="border-t border-line">
    <div class="mx-auto flex max-w-7xl flex-col gap-2 px-4 py-6 text-xs text-ink-3 sm:flex-row sm:items-center sm:justify-between sm:px-6">
      <span>Language Deathmatch — same programs, many languages, real benchmarks. Built with jQuery, Tailwind CSS, ECharts and highlight.js. A fan homage to arcade fighting games, not affiliated with any of them.</span>
      <span id="footer-run"></span>
    </div>
  </footer>

  <noscript><p class="p-6 text-center text-ink-2">Language Deathmatch needs JavaScript to render fights, projects and charts.</p></noscript>

  <script src="https://code.jquery.com/jquery-4.0.0.min.js"
          integrity="sha384-fgGyf7Mo7DURSOMnOy7ed+dkq5Job205Gnzu6QIg0BOHKaqt4D76Dt8VlDCzcMHV" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"
          integrity="sha384-C2iskrW/uPW46KzOjrvJIQo4YkV8lkD+QS0CrDN18IIPIpT/g2USu8bTP3nvmIAD" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"
          integrity="sha384-RH2xi4eIQ/gjtbs9fUXM68sLSi99C7ZWBRX1vDrVv6GQXRibxXLbwO2NGZB74MbU" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/x86asm.min.js"
          integrity="sha384-d1w6as9peRTJh7Tgj50482oZIrj0+1guPVjy1QRfEafPvwMu6JZ/J9CiS5cT8XE9" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/haskell.min.js"
          integrity="sha384-Z7NJwTxw7Rkjd5VqLt3KR5VyFUlCThJa7/4khFskUKDYPBiuk/UcS10ApTNW2Xxf" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/dockerfile.min.js"
          integrity="sha384-hly+Rz036+A3/domxShxHoja13X3lfx8nyG3V8aMeOe7Efwu6gUaSrDxq9BKwYk4" crossorigin="anonymous"></script>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
